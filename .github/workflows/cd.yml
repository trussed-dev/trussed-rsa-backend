name: Continuous delivery - crates.io

on:
  release:
    types: [published]

jobs:
  publish-trussed-rsa-alloc:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.release.tag_name, 'alloc-') }}
    environment: crates.io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      id: auth
    - run: cargo publish --package trussed-rsa-alloc
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  publish-trussed-rsa-types:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.release.tag_name, 'types-') }}
    environment: crates.io
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
      id: auth
    - run: cargo publish --package trussed-rsa-types
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
